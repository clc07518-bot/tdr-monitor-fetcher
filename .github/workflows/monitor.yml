name: TDR Monitor

on:
  schedule:
    # 30-minute interval keeps monthly GHA usage within the 2,000-min free
    # tier for private repos (~1,440 min/month at ~1 min/run).
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      backfill:
        description: 'X_BACKFILL: bypass seed and post latest items (verification mode)'
        type: boolean
        default: false
  push:
    branches: [ main ]

concurrency:
  group: tdr-monitor
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install python deps
        run: pip install -r requirements.txt

      - name: Setup Google Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install Playwright runtime deps
        run: python -m playwright install-deps chromium

      - name: Install Playwright Chromium (fallback)
        run: python -m playwright install chromium

      - name: Restore X auto-poster state
        uses: actions/cache/restore@v4
        with:
          path: .x_state.json
          key: x-state-${{ github.run_id }}
          restore-keys: |
            x-state-

      - name: Fetch & ingest
        env:
          WP_BASE: ${{ secrets.WP_BASE }}
          WP_INGEST_TOKEN: ${{ secrets.WP_INGEST_TOKEN }}
          PW_CHANNEL: chrome
          X_CONSUMER_KEY: ${{ secrets.X_CONSUMER_KEY }}
          X_CONSUMER_SECRET: ${{ secrets.X_CONSUMER_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          X_BACKFILL: ${{ inputs.backfill && '1' || '0' }}
        run: python fetcher.py

      - name: Save X auto-poster state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .x_state.json
          key: x-state-${{ github.run_id }}
